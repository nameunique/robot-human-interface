[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-human-interface"
version = "0.1.0"
description = "Camera-to-skeleton-to-MuJoCo teleoperation prototype for a 20-DOF humanoid"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mediapipe>=0.10.35,<0.11",
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<6",
  "PyQt6>=6.7,<7",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "websocket-client>=1.9,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-qt>=4.4,<5",
]

[project.scripts]
humanoid-interface = "robot_human_interface.gui.app:main"
robot-camera-teleop = "robot_human_interface.app.teleop:main"

[tool.uv]
required-version = ">=0.12.5"
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyqt6"
