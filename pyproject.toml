[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-human-interface"
version = "0.1.0"
description = "Camera-to-skeleton-to-MuJoCo teleoperation prototype for a 20-DOF humanoid"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe>=0.10.20,<0.11",
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<6",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "websocket-client>=1.9,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
robot-camera-teleop = "robot_human_interface.app.teleop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
