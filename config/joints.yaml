  start_pose: Assets/StreamingAssets/zero_poses/start_pose_hum_1.json
units:
  internal_angle: rad
  source_angle: deg
  length: m
  mass: kg
coordinates:
  source: Unity left-handed, x right / y up / z forward
  target: MuJoCo right-handed, x forward / y left / z up
  # v_mj = (-z_unity, -x_unity, y_unity) * scale.  The mapping preserves
  # right/left placement and must be checked against the real robot before HIL.
  unity_to_mujoco_vector: [-z, -x, y]
  model_space_to_metre_scale: 0.35
  verification_status: provisional_visual_check_required
physical_parameters:
