# Canonical 20-actuator schema shared by the MuJoCo proxy and future adapters.
#
# IMPORTANT: source axes/anchors/limits/masses were extracted from the active
# `control` model in Unity.  The Unity prefab has no serialized CoM or inertia
# tensors.  All MuJoCo geometry, inertia derived from that geometry, actuator
# gains and the 0.35 model-space-to-metre scale are therefore PROVISIONAL.
