# Classical double-support baseline.  The output is always the same 20 motor
# position targets used by MuJoCo, Unity and the legacy real-robot protocol.
standing_balance:
  enabled: true
  # Preserve a bounded continuous component of the IK leg pose.  Family-wise
  # caps keep a camera outlier inside the experimentally stable free-base
  # envelope; the support-state controller below gates unilateral motion by
  # measured sole loads before it admits the swing-leg component.
  lower_body_imitation_scale: 0.3
  # Independent yaw/roll with both soles planted shears the contacts.  Copy
  # these axes only after the corresponding leg is physically unloaded.
  transverse_lower_body_imitation_scale: 0.0
  # Produce a bounded swing-pose candidate, but do not apply it here.  The
  # support FSM admits only its explicitly selected leg in LIFT/HOLD after its
  # intent, stability and contact gates have all passed.
  swing_leg_imitation_scale: 0.65
  max_hip_yaw_deviation_rad: 0.13962634015954636     # 8 deg
  max_hip_roll_deviation_rad: 0.06981317007977318    # 4 deg
  max_hip_pitch_deviation_rad: 0.20943951023931953   # 12 deg
  max_knee_deviation_rad: 0.3141592653589793         # 18 deg
  max_ankle_pitch_deviation_rad: 0.10471975511965977 # 6 deg
  max_ankle_roll_deviation_rad: 0.06981317007977318  # 4 deg
  # Bilateral deep squat is outside the validated free-base envelope.  Fade
  # the entire pose toward home only when both legs simultaneously exceed both
  # thresholds; unilateral swing remains available to the support FSM.
  unsupported_hip_fade_start_rad: 0.2617993877991494  # 15 deg
  unsupported_hip_fade_full_rad: 0.5235987755982988   # 30 deg
  unsupported_knee_fade_start_rad: 0.20943951023931953 # 12 deg
  unsupported_knee_fade_full_rad: 0.4363323129985824   # 25 deg
  unsupported_pose_tracking_scale: 0.0
  # The extracted Unity home command is not a free-base equilibrium in the
  # provisional MuJoCo dynamics.  This bounded ankle target offset is the
  # verified double-support seed; it must be reidentified on real hardware.
  ankle_pitch_bias_rad: -0.04
  arm_to_ankle_gain: -0.055
  pitch_feedback_gain: 0.08
  pitch_rate_feedback_s: 0.005
  # Sagittal reference governor.  The divergent component of motion is
  # estimated from CoM relative to the midpoint of the two feet:
  #   xi = (com_x - neutral_x) + com_vx / sqrt(g / com_height)
  # Pose tracking fades only outside the inner capture margin.  A symmetric
  # knee/ankle motor residual then moves the pressure response back toward the
  # support region without writing the floating-base pose or applying force.
  capture_velocity_filter_time_constant_s: 0.08
  capture_tracking_margin_start_m: 0.035
  capture_tracking_margin_full_m: 0.075
  capture_recovery_gain_rad_per_m: 1.0
  capture_recovery_full_gain_rad_per_m: 2.0
  capture_recovery_max_rad: 0.3141592653589793 # 18 deg
  # Smoothly enable the extra recovery authority only when both soles carry
  # meaningful load.  Single-support landing retains the validated inner gain.
  capture_full_gain_start_foot_force_n: 4.0
  capture_full_gain_min_foot_force_n: 10.0
  capture_minimum_com_height_m: 0.20
  capture_minimum_total_support_force_n: 1.0
  capture_support_point_filter_time_constant_s: 0.04
  # Extension is much less stable than positive crouch in this provisional
  # linkage.  Preserve the full positive range but bound the signed negative
  # crouch coordinate to the measured recoverable envelope.
  max_inverse_crouch_amplitude_rad: 0.10471975511965977 # 6 deg
  # Confirmed bilateral squat planner. The scalar knee coordinate follows the
  # calibrated pelvis-descent ratio and commands [5q/3, q, -2q/3]. With this
  # model's signed axes, 5q/3-q-2q/3=0, preserving sole pitch while moving
  # thigh and shin in the same anatomical directions as the person. The 30 deg
  # cap is the verified long-hold limit with a 12 deg hip-limit reserve.
  squat_max_depth_rad: 0.5235987755982988 # 30 deg
  squat_input_gain: 1.0
  squat_hip_shape: 1.6666666666666667
  squat_ankle_shape: -0.6666666666666666
  squat_upper_body_fade_full_depth_rad: 0.10471975511965977 # 6 deg
  # During an authorized squat, deploy a fixed symmetric straight-arm pose.
  # In MuJoCo the robot faces -X; +84.6969 deg shoulder pitch makes the
  # shoulder-to-hand vector horizontal and forward. Smoothstep reaches the
  # full pose at q=19 deg without exceeding the 2.5 rad/s arm target slew.
  squat_arm_full_extension_depth_rad: 0.33161255787892263 # 19 deg
  squat_arm_shoulder_pitch_rad: 1.4782397712323851 # 84.6969 deg absolute
  squat_arm_elbow_rad: 0.0
  squat_arm_wrist_rad: 0.0
  # Keep the generic human-arm feed-forward unchanged; the forward squat pose
  # needs this separately verified sign and smaller magnitude.
  squat_arm_to_ankle_gain: 0.02
  squat_capture_recovery_gain_multiplier: 2.0
  squat_max_speed_rad_s: 0.6632251157578453 # 38 deg/s
  squat_max_acceleration_rad_s2: 5.235987755982989 # 300 deg/s^2
  squat_min_foot_force_n: 4.0
  squat_min_total_force_n: 20.0
  squat_deepen_max_tilt_rad: 0.20943951023931953 # 12 deg
  squat_deepen_max_angular_speed_rad_s: 1.0
  squat_capture_resume_m: 0.05
  squat_capture_hold_m: 0.07
  squat_capture_return_m: 0.09
  # Absolute DCM bounds relative to the midpoint of the two soles. They leave
  # 10 mm fore-aft and about 96 mm lateral reserve inside the model support hull.
  squat_max_absolute_capture_offset_x_m: 0.095
  squat_max_absolute_capture_offset_y_m: 0.16
  squat_neutral_max_base_speed_m_s: 0.10
  squat_return_tilt_rad: 0.3141592653589793 # 18 deg
  squat_return_angular_speed_rad_s: 3.0
  squat_support_release_depth_rad: 0.03490658503988659 # 2 deg
  squat_support_release_speed_rad_s: 0.08726646259971647 # 5 deg/s
  squat_support_release_tracking_error_rad: 0.08726646259971647 # 5 deg
  upper_body_rate_limit_rad_s: 2.5
  lower_body_rate_limit_rad_s: 1.2
  # The provisional robot cannot statically balance both heavy arms beyond
  # roughly home+70 deg.  This is a feasibility projection, not a joint limit.
  max_shoulder_deviation_rad: 1.2217304763960306 # 70 deg
  tracking_fade_start_rad: 0.13962634015954636   # 8 deg
  recovery_tilt_rad: 0.3141592653589793          # 18 deg

# Camera-side intent detector.  Height is measured along a neutral calibrated
# image-plane up axis and normalized by leg length.  These thresholds cleanly
# separate all four one-leg episodes in the bundled slow-balance MP4.
human_support_intent:
  calibration_frames: 30
  calibration_max_observations: 150
  calibration_max_pose_spread_ratio: 0.06
  calibration_max_ankle_offset_ratio: 0.08
  calibration_max_ankle_spread_ratio: 0.035
  calibration_max_arm_deviation_rad: 1.0471975511965976 # 60 deg
  calibration_max_upper_arm_deviation_rad: 1.0471975511965976 # 60 deg
  calibration_max_elbow_flexion_rad: 1.0471975511965976 # 60 deg
  calibration_max_knee_flexion_rad: 0.7853981633974483 # 45 deg
  confidence_threshold: 0.5
  activate_height_ratio: 0.15
  release_height_ratio: 0.08
  activation_hold_s: 0.30
  release_hold_s: 0.20
  filter_time_constant_s: 0.10
  max_gap_s: 0.25
  activation_confidence: 0.65
  maintain_confidence: 0.50
  # Bilateral squat intent reuses the exact same admitted neutral window.
  # Pelvis descent is measured in aspect-corrected image coordinates relative
  # to the neutral ankle midpoint and normalized by neutral leg-chain length.
  # Both legs must flex together; ankle-height and stance-width gates exclude
  # one-leg lifts and jumping/stepping gestures.
  squat_enter_pelvis_descent_ratio: 0.10
  squat_exit_pelvis_descent_ratio: 0.06
  squat_full_pelvis_descent_ratio: 0.50
  squat_enter_hip_flexion_rad: 0.3490658503988659 # 20 deg
  squat_exit_hip_flexion_rad: 0.20943951023931953 # 12 deg
  squat_enter_knee_flexion_rad: 0.4363323129985824 # 25 deg
  squat_exit_knee_flexion_rad: 0.2617993877991494 # 15 deg
  squat_activate_max_ankle_asymmetry_ratio: 0.10
  squat_maintain_max_ankle_asymmetry_ratio: 0.14
  squat_activate_max_stance_width_change_ratio: 0.10
  squat_maintain_max_stance_width_change_ratio: 0.15
  squat_activation_hold_s: 0.05
  squat_release_hold_s: 0.15
  squat_filter_time_constant_s: 0.05

# Safe one-leg sequence applied after StandingBalanceController.  The motion
# offsets themselves are verified constants in control/support.py; this block
# contains only timing and measured-load gates.
support_control:
  shift_duration_s: 2.0
  load_confirm_duration_s: 0.15
  stance_load_timeout_s: 1.5
  lift_duration_s: 1.5
  # Give physical servos time to reach the verified apex when a short camera
  # gesture ends on the exact tick HOLD begins. Stale/unstable returns bypass it.
  minimum_hold_duration_s: 0.25
  # Returning too quickly injects enough sagittal velocity to exceed the
  # current ankle controller's capture region.  Three-second ramps recovered
  # to stable double support in both verified swing directions.
  lower_duration_s: 3.0
  # Do not remove the lateral weight shift until the returning sole really
  # carries load.  A slow preload avoids the fall previously observed while
  # CENTER_WEIGHT started with only ~2 N on the returning foot.
  touchdown_confirm_duration_s: 0.15
  touchdown_preload_duration_s: 8.0
  touchdown_timeout_s: 8.0
  center_duration_s: 3.0
  support_loss_grace_s: 0.08
  min_stance_force_n: 12.0
  min_stance_load_fraction: 0.65
  max_swing_load_fraction: 0.35
  min_touchdown_force_n: 4.0
  # Once a landing has passed the stricter timed 4 N confirmation, retain
  # centering only while both solver contacts remain physically present.
  min_touchdown_contact_force_n: 2.0
  min_touchdown_total_force_n: 20.0
  # Once the verified lift is nearly lowered, accept sustained physical sole
  # contact without driving the nominal profile through that contact first.
  early_touchdown_max_swing_progress: 0.45
  # Admit a new one-leg cycle only from a quiet, nearly upright base.  Once a
  # cycle is active, the wider envelope triggers a controlled lower/center
  # recovery rather than allowing the requested lift to continue.
  start_max_tilt_rad: 0.20943951023931953       # 12 deg
  active_max_tilt_rad: 0.3141592653589793       # 18 deg
  start_max_angular_speed_rad_s: 1.0
  active_max_angular_speed_rad_s: 3.0
  # Once force gates confirm single support, blend the moving leg's bounded IK
  # reference with the verified lift profile.  The stance leg remains frozen
  # except for live ankle-pitch balance feedback.
  # Convexly blend at most 25% pose reference against the verified lift.  The
  # lift is not weakened at all when the IK reference is neutral.
  swing_reference_blend: 0.25
  max_swing_reference_delta_rad: 0.20943951023931953 # 12 deg
  # A one-foot support polygon cannot tolerate the same moving upper-body mass
  # as double support.  Fade to a small, still-correlated IK component during
  # the shift and restore the full pose while centering after touchdown.
  single_support_upper_body_scale: 0.15
  # Final defense after every phase overlay.  These match the standing layer,
  # so no support transition can bypass the deployable motor-target slew rate.
  upper_body_rate_limit_rad_s: 2.5
  lower_body_rate_limit_rad_s: 1.2
  cancel_on_stale_reference: true
